name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then echo "仓库里没有找到 zip 压缩包，请把工程压缩包上传到仓库"; exit 1; fi
          echo "使用压缩包：$ZIP"
          unzip -o "$ZIP"
          cd ToolboxNative
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-apk
          path: ToolboxNative/app/build/outputs/apk/debug/app-debug.apk
